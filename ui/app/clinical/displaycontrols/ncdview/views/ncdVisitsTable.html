<style>
    .table > tbody > tr > td {
        padding-top: 2px;
        padding-bottom: 1px;
        line-height: 1.50;
        vertical-align: middle;
        font-size: 12px;
    }

    .table > thead > tr > th {
        font-size: 12px;
        line-height: 1.00;
    }

    .even {
        background-color: #F9F8F8;
    }

    .odd {
        background-color: #F6F6F6;
        box-shadow: inset 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
</style>

<section class="block patientInformation">
    <h2 class="section-title" ng-hide="::params.translationKey" ng-if="::params.title">
        {{::params.title}}
    </h2>
    <h2 class="section-title" ng-show="::params.translationKey">
        {{::params.translationKey|translate}}
    </h2>
    <div>
        <p class="placeholder-text" ng-if="!hasVisits()">{{::noVisitsMessage}}</p>

        <table ng-if="hasVisits()" id="myTable" class="table table-bordered f12" style="color:black;">
            <thead>
            <tr class="bg-heavy-rain" style="font-weight:bold; line-height: 1.20 !important;">
                <th scope="col">#</th>
                <th scope="col">Date</th>
                <th scope="col">Symptom</th>
            </tr>
            </thead>
            <tbody>
            <tr class="hand" ng-repeat="p in ncdVisits track by $index" style="line-height: 1.20 !important;" ng-class="$index % 2 == 0 ? 'even' : 'odd'" pagination-id="pqTable">
                <td>{{$index + 1}}</td>
                <td> {{p.created_date | date:'dd-MM-yyyy'}}</td>
                <td> {{p.bangla_names}}</td>
            </tr>
            </tbody>
        </table>

    </div>
</section>
